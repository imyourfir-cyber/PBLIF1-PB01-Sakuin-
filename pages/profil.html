<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profil – Sakuin</title>
  <link rel="icon" href="../assets/img/logo.png">
  <link rel="stylesheet" href="../assets/lib/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/lib/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body data-halaman="profil">
  <div class="layout">

    <!-- SIDEBAR: menu di sisi kiri -->
    <aside class="sidebar p-3">
      <a href="dashboard.html" class="d-flex align-items-center gap-2 text-decoration-none text-success mb-4">
        <img src="../assets/img/logo.png" width="36" alt="">
        <b class="fs-4">Sakuin</b>
      </a>

      <nav class="nav nav-pills flex-column gap-1">
        <a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
        <a class="nav-link" href="transaksi.html"><i class="bi bi-arrow-left-right me-2"></i>Transaksi</a>
        <a class="nav-link" href="kategori.html"><i class="bi bi-tags me-2"></i>Kategori</a>
        <a class="nav-link" href="anggaran.html"><i class="bi bi-pie-chart me-2"></i>Anggaran</a>
        <a class="nav-link" href="tabungan.html"><i class="bi bi-piggy-bank me-2"></i>Tabungan</a>
        <a class="nav-link" href="laporan.html"><i class="bi bi-file-earmark-text me-2"></i>Laporan</a>
        <a class="nav-link mt-auto" href="pengaturan.html"><i class="bi bi-gear me-2"></i>Pengaturan</a>
      </nav>
    </aside>

    <div class="konten">

      <!-- TOPBAR: judul halaman dan menu pengguna -->
      <header class="d-flex justify-content-between align-items-center border-bottom px-4 py-3">
        <h4 class="m-0">Profil</h4>

        <div class="dropdown">
          <a href="#" class="d-flex align-items-center gap-2 text-decoration-none text-body dropdown-toggle" data-bs-toggle="dropdown">
            <img id="foto-user" class="avatar" alt="Foto">
            <span id="nama-user" class="fw-semibold"></span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li class="px-3 py-2">
              <b id="menu-nama"></b><br>
              <small class="text-body-secondary" id="menu-username"></small>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="profil.html">Profil</a></li>
            <li><a class="dropdown-item" href="pengaturan.html">Pengaturan</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" href="../auth/login.html?logout=1">Logout</a></li>
          </ul>
        </div>
      </header>

      <!-- ISI HALAMAN -->
      <main class="p-4">
        <div class="card mx-auto" style="max-width: 640px"><div class="card-body">
          <h5 class="mb-3">Profil</h5>

          <!-- Foto -->
          <div class="text-center border-top pt-4 pb-3">
            <img id="foto-profil" class="avatar avatar-besar mb-2" alt="Foto profil">
            <div><small class="text-body-secondary">Foto / Avatar Mahasiswa</small></div>
            <label class="btn btn-outline-success btn-sm mt-2">
              Ganti foto
              <input type="file" id="input-foto" accept="image/jpeg,image/png,image/webp" hidden>
            </label>
          </div>

          <!-- Informasi akun (diisi profil.js) -->
          <h6 class="border-top pt-3">Informasi Akun</h6>
          <div id="info-akun"></div>

          <button class="btn btn-success mt-3" onclick="ubahProfil()">Ubah Profil</button>
        </div></div>
      </main>

    </div>
  </div>

  <!-- Modal ubah profil -->
  <div class="modal fade" id="modal-profil" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content" id="form-profil">
        <div class="modal-header">
          <h5 class="modal-title">Ubah Profil</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <label class="form-label">Nama lengkap *</label>
          <input class="form-control mb-3" name="nama" required maxlength="100">

          <label class="form-label">Username</label>
          <input class="form-control mb-3" name="username" disabled>

          <label class="form-label">Email</label>
          <input class="form-control mb-3" name="email" type="email" placeholder="nama@email.com">

          <label class="form-label">NIM (opsional)</label>
          <input class="form-control" name="nim" maxlength="20" placeholder="Masukkan NIM">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
          <button class="btn btn-success">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../assets/lib/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/profil.js"></script>
</body>
</html>
