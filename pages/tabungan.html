<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabungan – Sakuin</title>
  <link rel="icon" href="../assets/img/logo.png">
  <link rel="stylesheet" href="../assets/lib/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/lib/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body data-halaman="tabungan">
  <div class="layout">

    <!-- SIDEBAR: menu di sisi kiri -->
    <aside class="sidebar p-3">
      <a href="dashboard.html" class="d-flex align-items-center gap-2 text-decoration-none text-success mb-4">
        <img src="../assets/img/logo.png" width="36" alt="">
        <b class="fs-4">Sakuin</b>
      </a>

      <nav class="nav nav-pills flex-column gap-1">
        <a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
        <a class="nav-link" href="transaksi.html"><i class="bi bi-arrow-left-right me-2"></i>Transaksi</a>
        <a class="nav-link" href="kategori.html"><i class="bi bi-tags me-2"></i>Kategori</a>
        <a class="nav-link" href="anggaran.html"><i class="bi bi-pie-chart me-2"></i>Anggaran</a>
        <a class="nav-link active" href="tabungan.html"><i class="bi bi-piggy-bank me-2"></i>Tabungan</a>
        <a class="nav-link" href="laporan.html"><i class="bi bi-file-earmark-text me-2"></i>Laporan</a>
        <a class="nav-link mt-auto" href="pengaturan.html"><i class="bi bi-gear me-2"></i>Pengaturan</a>
      </nav>
    </aside>

    <div class="konten">

      <!-- TOPBAR: judul halaman dan menu pengguna -->
      <header class="d-flex justify-content-between align-items-center border-bottom px-4 py-3">
        <h4 class="m-0">Tabungan</h4>

        <div class="dropdown">
          <a href="#" class="d-flex align-items-center gap-2 text-decoration-none text-body dropdown-toggle" data-bs-toggle="dropdown">
            <img id="foto-user" class="avatar" alt="Foto">
            <span id="nama-user" class="fw-semibold"></span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li class="px-3 py-2">
              <b id="menu-nama"></b><br>
              <small class="text-body-secondary" id="menu-username"></small>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="profil.html">Profil</a></li>
            <li><a class="dropdown-item" href="pengaturan.html">Pengaturan</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" href="../auth/login.html?logout=1">Logout</a></li>
          </ul>
        </div>
      </header>

      <!-- ISI HALAMAN -->
      <main class="p-4">
        <!-- Ringkasan -->
        <div class="row g-3 mb-4">
          <div class="col-md-4">
            <div class="card h-100"><div class="card-body">
              <small class="text-body-secondary">Total Tabungan</small>
              <h4 class="text-success mb-0" id="total-tabungan"></h4>
            </div></div>
          </div>
          <div class="col-md-4">
            <div class="card h-100 border-success"><div class="card-body">
              <small class="text-body-secondary">Saldo Tersedia</small>
              <h4 class="mb-0" id="saldo-tersedia"></h4>
            </div></div>
          </div>
          <div class="col-md-4">
            <div class="card h-100"><div class="card-body d-grid gap-2">
              <button class="btn btn-success" onclick="tambahTarget()">+ Target Baru</button>
              <a class="btn btn-outline-success btn-sm" href="laporan.html?jenis=Tabungan">Lihat Rekap</a>
            </div></div>
          </div>
        </div>

        <!-- Kartu target (diisi tabungan.js) -->
        <div class="row g-3" id="daftar-target"></div>
      </main>

    </div>
  </div>

  <!-- Modal tambah / ubah target -->
  <div class="modal fade" id="modal-target" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content" id="form-target">
        <div class="modal-header">
          <h5 class="modal-title" id="judul-modal">Target Tabungan Baru</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="idTarget">

          <label class="form-label">Nama target *</label>
          <input class="form-control mb-3" name="nama" required maxlength="80" placeholder="Contoh: Laptop baru">

          <label class="form-label">Jumlah target *</label>
          <input class="form-control" type="number" name="jumlah" min="1" required placeholder="Rp 0">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
          <button class="btn btn-success">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal nabung -->
  <div class="modal fade" id="modal-setor" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content" id="form-setor">
        <div class="modal-header">
          <h5 class="modal-title">Nabung</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="idTarget">

          <label class="form-label">Target</label>
          <input class="form-control mb-3" name="nama" disabled>

          <label class="form-label">Tanggal *</label>
          <input class="form-control mb-3" type="date" name="tanggal" required>

          <label class="form-label">Nominal *</label>
          <input class="form-control" type="number" name="nominal" min="1" required placeholder="Rp 0">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
          <button class="btn btn-success">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../assets/lib/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/tabungan.js"></script>
</body>
</html>
