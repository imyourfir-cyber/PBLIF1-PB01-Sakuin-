<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transaksi – Sakuin</title>
  <link rel="icon" href="../assets/img/logo.png">
  <link rel="stylesheet" href="../assets/lib/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/lib/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body data-halaman="transaksi">
  <div class="layout">

    <!-- SIDEBAR: menu di sisi kiri -->
    <aside class="sidebar p-3">
      <a href="dashboard.html" class="d-flex align-items-center gap-2 text-decoration-none text-success mb-4">
        <img src="../assets/img/logo.png" width="36" alt="">
        <b class="fs-4">Sakuin</b>
      </a>

      <nav class="nav nav-pills flex-column gap-1">
        <a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
        <a class="nav-link active" href="transaksi.html"><i class="bi bi-arrow-left-right me-2"></i>Transaksi</a>
        <a class="nav-link" href="kategori.html"><i class="bi bi-tags me-2"></i>Kategori</a>
        <a class="nav-link" href="anggaran.html"><i class="bi bi-pie-chart me-2"></i>Anggaran</a>
        <a class="nav-link" href="tabungan.html"><i class="bi bi-piggy-bank me-2"></i>Tabungan</a>
        <a class="nav-link" href="laporan.html"><i class="bi bi-file-earmark-text me-2"></i>Laporan</a>
        <a class="nav-link mt-auto" href="pengaturan.html"><i class="bi bi-gear me-2"></i>Pengaturan</a>
      </nav>
    </aside>

    <div class="konten">

      <!-- TOPBAR: judul halaman dan menu pengguna -->
      <header class="d-flex justify-content-between align-items-center border-bottom px-4 py-3">
        <h4 class="m-0">Transaksi</h4>

        <div class="dropdown">
          <a href="#" class="d-flex align-items-center gap-2 text-decoration-none text-body dropdown-toggle" data-bs-toggle="dropdown">
            <img id="foto-user" class="avatar" alt="Foto">
            <span id="nama-user" class="fw-semibold"></span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li class="px-3 py-2">
              <b id="menu-nama"></b><br>
              <small class="text-body-secondary" id="menu-username"></small>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="profil.html">Profil</a></li>
            <li><a class="dropdown-item" href="pengaturan.html">Pengaturan</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" href="../auth/login.html?logout=1">Logout</a></li>
          </ul>
        </div>
      </header>

      <!-- ISI HALAMAN -->
      <main class="p-4">
        <div class="card"><div class="card-body">

          <!-- Filter dan tombol tambah -->
          <form class="row g-2 mb-3" id="form-filter">
            <div class="col-md-3"><input class="form-control" name="kata" placeholder="Cari kata kunci"></div>
            <div class="col-md-2">
              <select class="form-select" name="jenis">
                <option value="">Semua Jenis</option>
                <option>Pemasukan</option>
                <option>Pengeluaran</option>
              </select>
            </div>
            <div class="col-md-2"><select class="form-select" name="kategori" id="filter-kategori"></select></div>
            <div class="col-md-2"><input class="form-control" type="date" name="dari" title="Dari tanggal"></div>
            <div class="col-md-2"><input class="form-control" type="date" name="sampai" title="Sampai tanggal"></div>
            <div class="col-md-1 d-grid"><button class="btn btn-outline-success">Filter</button></div>
          </form>

          <button class="btn btn-success mb-3" onclick="tambahTransaksi()">+ Tambah Transaksi</button>

          <!-- Tabel (isi baris dibuat oleh transaksi.js) -->
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th>No</th><th>Tanggal</th><th>Jenis</th><th>Kategori</th>
                  <th class="text-end">Nominal</th><th>Keterangan</th><th class="text-end">Aksi</th>
                </tr>
              </thead>
              <tbody id="isi-tabel"></tbody>
            </table>
          </div>

        </div></div>
      </main>

    </div>
  </div>

  <!-- Modal tambah / ubah transaksi -->
  <div class="modal fade" id="modal-transaksi" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content" id="form-transaksi">
        <div class="modal-header">
          <h5 class="modal-title" id="judul-modal">Tambah Transaksi</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="idTransaksi">

          <label class="form-label">Tanggal *</label>
          <input class="form-control mb-3" type="date" name="tanggal" required>

          <label class="form-label">Jenis *</label>
          <select class="form-select mb-3" name="jenis" id="form-jenis">
            <option>Pemasukan</option>
            <option>Pengeluaran</option>
          </select>

          <label class="form-label">Kategori *</label>
          <select class="form-select mb-3" name="kategori" id="form-kategori" required></select>

          <label class="form-label">Nominal *</label>
          <input class="form-control mb-3" type="number" name="nominal" min="1" required placeholder="Rp 0">

          <label class="form-label">Keterangan</label>
          <textarea class="form-control" name="keterangan" rows="2" maxlength="200" placeholder="Tulis keterangan"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
          <button class="btn btn-success">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../assets/lib/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/transaksi.js"></script>
</body>
</html>
