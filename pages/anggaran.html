<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anggaran – Sakuin</title>
  <link rel="icon" href="../assets/img/logo.png">
  <link rel="stylesheet" href="../assets/lib/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/lib/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body data-halaman="anggaran">
  <div class="layout">

    <!-- SIDEBAR: menu di sisi kiri -->
    <aside class="sidebar p-3">
      <a href="dashboard.html" class="d-flex align-items-center gap-2 text-decoration-none text-success mb-4">
        <img src="../assets/img/logo.png" width="36" alt="">
        <b class="fs-4">Sakuin</b>
      </a>

      <nav class="nav nav-pills flex-column gap-1">
        <a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
        <a class="nav-link" href="transaksi.html"><i class="bi bi-arrow-left-right me-2"></i>Transaksi</a>
        <a class="nav-link" href="kategori.html"><i class="bi bi-tags me-2"></i>Kategori</a>
        <a class="nav-link active" href="anggaran.html"><i class="bi bi-pie-chart me-2"></i>Anggaran</a>
        <a class="nav-link" href="tabungan.html"><i class="bi bi-piggy-bank me-2"></i>Tabungan</a>
        <a class="nav-link" href="laporan.html"><i class="bi bi-file-earmark-text me-2"></i>Laporan</a>
        <a class="nav-link mt-auto" href="pengaturan.html"><i class="bi bi-gear me-2"></i>Pengaturan</a>
      </nav>
    </aside>

    <div class="konten">

      <!-- TOPBAR: judul halaman dan menu pengguna -->
      <header class="d-flex justify-content-between align-items-center border-bottom px-4 py-3">
        <h4 class="m-0">Anggaran</h4>

        <div class="dropdown">
          <a href="#" class="d-flex align-items-center gap-2 text-decoration-none text-body dropdown-toggle" data-bs-toggle="dropdown">
            <img id="foto-user" class="avatar" alt="Foto">
            <span id="nama-user" class="fw-semibold"></span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li class="px-3 py-2">
              <b id="menu-nama"></b><br>
              <small class="text-body-secondary" id="menu-username"></small>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="profil.html">Profil</a></li>
            <li><a class="dropdown-item" href="pengaturan.html">Pengaturan</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" href="../auth/login.html?logout=1">Logout</a></li>
          </ul>
        </div>
      </header>

      <!-- ISI HALAMAN -->
      <main class="p-4">
        <!-- Judul + tombol atur batas -->
        <div class="card mb-3"><div class="card-body d-flex justify-content-between align-items-center flex-wrap gap-2">
          <div>
            <h5 class="mb-0" id="judul-bulan"></h5>
            <small class="text-body-secondary">Atur batas total bulanan atau per kategori. Kalau terlampaui, Sakuin akan mengingatkanmu.</small>
          </div>
          <button class="btn btn-success" onclick="aturBatas()">+ Atur Batas</button>
        </div></div>

        <!-- Kartu anggaran (diisi anggaran.js) -->
        <div class="row g-3" id="daftar-anggaran"></div>
      </main>

    </div>
  </div>

  <!-- Modal atur batas -->
  <div class="modal fade" id="modal-anggaran" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content" id="form-anggaran">
        <div class="modal-header">
          <h5 class="modal-title">Atur Batas Pengeluaran</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <label class="form-label">Berlaku untuk *</label>
          <select class="form-select mb-3" name="kategori" id="pilih-kategori"></select>

          <label class="form-label">Batas maksimal per bulan *</label>
          <input class="form-control" type="number" name="batas" min="1" required placeholder="Rp 0">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
          <button class="btn btn-success">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../assets/lib/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/anggaran.js"></script>
</body>
</html>
