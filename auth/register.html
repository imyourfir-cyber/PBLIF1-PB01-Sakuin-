<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar – Sakuin</title>
  <link rel="icon" href="../assets/img/logo.png">
  <link rel="stylesheet" href="../assets/lib/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="auth-wrap p-3">
    <div class="card shadow border-0 w-100" style="max-width: 880px">
      <div class="row g-0">

        <!-- Kiri: logo dan slogan -->
        <div class="col-md-6 bg-success-subtle d-flex flex-column align-items-center justify-content-center text-center p-5 rounded-start">
          <img src="../assets/img/logo.png" width="110" alt="Logo Sakuin">
          <h1 class="text-success mt-2">Sakuin</h1>
          <p class="text-body-secondary mb-0">Catat uang sakumu, capai targetmu.</p>
        </div>

        <!-- Kanan: form -->
        <div class="col-md-6 p-4 p-md-5">
          <h2 class="mb-4">Buat akun baru</h2>

          <form id="form-daftar">
            <label class="form-label">Nama lengkap</label>
            <input class="form-control mb-3" name="nama" required maxlength="100" placeholder="Masukkan nama lengkap">

            <label class="form-label">Username</label>
            <input class="form-control mb-3" name="username" required placeholder="Masukkan username">

            <label class="form-label">Email</label>
            <input class="form-control mb-3" name="email" type="email" required placeholder="nama@email.com">

            <label class="form-label">Password</label>
            <input class="form-control mb-3" name="password" type="password" required placeholder="Minimal 6 karakter">

            <label class="form-label">Konfirmasi password</label>
            <input class="form-control" name="konfirmasi" type="password" required placeholder="Ulangi password">

            <!-- Pesan error diisi oleh register.js -->
            <div class="text-danger small mt-2" id="error"></div>

            <button class="btn btn-success w-100 mt-3">Daftar</button>
          </form>

          <p class="text-center text-body-secondary mt-4 mb-0">
            Sudah punya akun? <a href="login.html" class="text-success fw-bold">Masuk</a>
          </p>
        </div>

      </div>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/register.js"></script>
</body>
</html>
