<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Baru – Sakuin</title>
  <link rel="icon" href="../assets/img/logo.png">
  <link rel="stylesheet" href="../assets/lib/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="auth-wrap p-3">
    <div class="card shadow border-0 w-100" style="max-width: 880px">
      <div class="row g-0">

        <!-- Kiri: logo dan slogan -->
        <div class="col-md-6 bg-success-subtle d-flex flex-column align-items-center justify-content-center text-center p-5 rounded-start">
          <img src="../assets/img/logo.png" width="110" alt="Logo Sakuin">
          <h1 class="text-success mt-2">Sakuin</h1>
          <p class="text-body-secondary mb-0">Catat uang sakumu, capai targetmu.</p>
        </div>

        <!-- Kanan: form -->
        <div class="col-md-6 p-4 p-md-5">
          <h2>Buat password baru</h2>
          <p class="text-body-secondary">
            Passwordmu sudah direset admin. Buat password baru untuk melanjutkan.
          </p>

          <form id="form-ganti">
            <label class="form-label">Password baru</label>
            <input class="form-control mb-3" name="baru" type="password" required placeholder="Minimal 6 karakter">

            <label class="form-label">Konfirmasi password baru</label>
            <input class="form-control" name="konfirmasi" type="password" required placeholder="Ulangi password baru">

            <!-- Pesan error diisi oleh ganti.js -->
            <div class="text-danger small mt-2" id="error"></div>

            <button class="btn btn-success w-100 mt-3">Simpan Password</button>
          </form>

          <p class="text-center mt-4 mb-0"><a href="login.html?logout=1" class="text-success">Batal dan keluar</a></p>
        </div>

      </div>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/ganti.js"></script>
</body>
</html>
